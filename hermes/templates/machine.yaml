# A whole faker-kit Hermes machine. hermes/setup-machine.sh reads this file and rebuilds the machine
# from it, on any Linux or macOS host; run it again after every change. It holds no secret: the
# script asks for tokens with hidden input and keeps them in the profiles' .env files.
version: 1

# The bot that sets up projects (faker-kit install --bootstrap-bot).
bootstrap_bot: faker-kit-bootstrap
# true: every bot's model runs on your Claude subscription through the logged-in Claude Code CLI.
# false: each bot keeps the provider its Hermes profile has, or takes the provider and model given below.
# Cloud sessions run in Claude Code either way.
claude_subscription: true
# Optional, only with claude_subscription: false: the bootstrap bot's Hermes provider id and model, always
# together. The kit picks neither; write the ones you chose. Sign in to the provider from your own terminal first.
# bootstrap_provider: CHANGE-ME
# bootstrap_model: CHANGE-ME
# The kit commit to install; setup-machine.sh needs this unless you pass --ref.
# kit_ref: 0123456789abcdef0123456789abcdef01234567

# Kit plugins whose skills your default Hermes profile and every kit bot load,
# straight from the installed kit, so a kit update updates them. Remove a name to remove its skills.
skills:
  - pstack
  - trust-ladder

# Written into ~/.hermes/faker-kit/guard.yaml; its comments explain each setting.
guard:
  trusted_authors:
    - CHANGE-ME          # your GitHub login
  ask_owner: true
  max_in_flight_total: 500
  max_in_flight_per_project: 50

# One project bot per repository. Each plays the long-lived coordinator chat for its project.
projects:
  - bot: my-project
    project: my-project
    repo: CHANGE-ME/repo
    heartbeat_every: 1h    # the fallback wake; GitHub webhooks wake the bot as events happen
    # Optional: the bot's model. model alone sets only the model; provider needs model with it.
    # provider: CHANGE-ME
    # model: CHANGE-ME

# Optional: run these repositories' GitHub Actions jobs on this machine (needs Docker). Each job gets
# a fresh Linux container that sees nothing of this machine. Workflows ask for them with
# `runs-on: [self-hosted, faker-kit]`. slots: how many jobs run at once (1 to 8, default 1).
# ci_runners:
#   - repo: CHANGE-ME/repo
#     slots: 2

# Optional: the chief of staff across all projects.
chief:
  bot: chief
  # provider: CHANGE-ME    # optional, as for a project bot
  # model: CHANGE-ME

# Optional: GitHub events reach Hermes through a Cloudflare Tunnel at this address, a hostname in a
# zone of your Cloudflare account. Only the signed webhook paths are public.
webhooks:
  url: https://hermes.CHANGE-ME.example
  tunnel: hermes

# Optional: Hermes's own Slack platform. Put SLACK_BOT_TOKEN and SLACK_APP_TOKEN in ~/.hermes/.env
# (setup-machine.sh asks for them); the bot's jobs then also deliver to this channel. The bot is one of
# the project bots above.
# slack:
#   bot: my-project
#   channel_id: C0123456789
