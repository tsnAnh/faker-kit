# team-kit guard policy for one machine. Lives at ~/.hermes/team-kit/guard.yaml.
# Read by the team_kit_guard Hermes plugin on every tool call, and by team-kit-gh and
# team-kit-admin. If this file is missing or invalid,
# the guard blocks every tool call of every team-kit bot.
#
# Which Hermes profiles are bots, their roles, and each project's one repository live in
# bots.yaml next to this file. team-kit-admin writes bots.yaml. Do not list repositories here.
version: 2

# Cloud coding sessions running at once, across every project on this machine. They all draw
# on one Claude or ChatGPT subscription, and project bots cannot see each other, so only this
# number stops five projects from starting fifteen sessions. Each repository also has its own
# max_in_flight in .agents/dispatch.json. A launch needs room under both.
max_in_flight_total: 3

# GitHub logins whose unit issues and reports count: the login each project bot opens issues as,
# and the account the coding agent posts as (for Claude Code on the web, usually the owner).
# Reports by anyone else are ignored, so a copied report cannot move a unit.
# team-kit-admin setup-repo writes these logins into the repository's trusted_dispatchers.
trusted_authors:
  - OWNER-LOGIN

# Refuse to open an issue whose body is not a parsed brief with the team-kit marker.
require_brief_marker: true

# Tool results from these are wrapped in <untrusted source=...> and taint the turn.
# After that, every tool not in read_only_tools needs the owner's approval in Desktop.
# team-kit-gh report-status is not here: it prints only the parsed status line.
# team-kit-gh chief-proposals is: it prints a chief proposal's body, which is text the owner has not read.
untrusted_readers:
  - tool: web_*
  - tool: browser_*
  - tool: x_search
  - tool: terminal
    command: "team-kit-gh teammate-proposals*"
  - tool: terminal
    command: "team-kit-gh read *"
  - tool: terminal
    command: "team-kit-gh chief-proposals*"

# Tool calls blocked outright, for every bot. A plain string is a glob over each simple
# command in a terminal call. {tool, command} matches other tools.
deny:
  - "gh pr merge*"
  - "gh api* -X DELETE*"
  - "gh api* --method DELETE*"
  - "gh repo delete*"
  - "git push* main"
  - "git push* main *"
  - "git push* *:main*"
  - "git push* master"
  - "git push* *:master*"
  - "git push* --force*"
  - "git push* -f*"
  - tool: delegate_task
  - tool: cronjob_manage
  - tool: execute_code
  - tool: skill_manage

# Tools that never change anything. Everything else counts as side-effecting.
read_only_tools:
  - read_file
  - search_files
  - skills_list
  - skill_view
  - session_search
  - clarify
  - todo_list
  - web_search
  - web_extract
  - vision_analyze
