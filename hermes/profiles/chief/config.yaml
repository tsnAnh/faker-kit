# Merged into the chief of staff's profile config by team-kit-admin add-chief. Keys here win;
# lists are replaced, except plugins.enabled, which gains team_kit_guard.
# The model is set separately: add-chief --model M, or
# `hermes -p NAME config set model.default <model>`.
#
toolsets: [web, browser, terminal, file, code_execution, vision, image_gen, tts, skills, todo, memory, session_search, connections, clarify, delegation, cronjob, computer_use]
approvals:
  mode: manual
  cron_mode: deny
plugins:
  enabled: [team_kit_guard]
timezone: Asia/Saigon
