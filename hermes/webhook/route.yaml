# One webhook route per project bot, written into the default host profile's config by
# team-kit-admin add-project. The shared listener owns every route; `profile` binds this one to
# its project bot, so GitHub posts to /p/<bot>/webhooks/team-kit-<project>, and the script and
# cron job run in that bot's restricted profile. One generated secret, in
# ~/.hermes/team-kit/webhook-secret, signs every route.
#
# The route runs no agent of its own, so it has no toolsets: github-triage.py drops every event
# that does not change a unit of this project, and a kept event fires the bot's team-kit-drain
# cron job with the prompt below as its context. Hermes refuses `coalesce` together with
# `cron_job`. An event that arrives while the job runs is not queued, so the job's sweep re-reads
# every open unit, and its schedule is the safety net.
events: [pull_request, issue_comment, check_suite]
secret: "@TEAM_KIT_WEBHOOK_SECRET@"
profile: "@TEAM_KIT_BOT@"
script: team-kit/github-triage.py
cron_job: team-kit-drain
prompt: |
  team-kit unit event: {team_kit.event}
  repo: {team_kit.repo}
  card: {team_kit.card}
  issue: {team_kit.issue}
  pr: {team_kit.pr}
  status: {team_kit.status}
  conclusion: {team_kit.conclusion}
