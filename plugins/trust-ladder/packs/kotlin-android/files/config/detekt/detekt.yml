build:
  maxIssues: 0

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true
  LateinitUsage:
    active: true
    ignoreOnClassesPattern: '.*(Test|Activity|Fragment)$'

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
  TooGenericExceptionThrown:
    active: true

coroutines:
  GlobalCoroutineUsage:
    active: true
  InjectDispatcher:
    active: true

style:
  ForbiddenComment:
    active: true
    comments:
      - value: 'TODO'
        reason: 'Open a task instead. A TODO in code tells the next agent the workaround is acceptable.'
      - value: 'FIXME'
        reason: 'Fix it now or open a task.'
      - value: 'HACK'
        reason: 'Fix the root cause; hacks get copied.'
      - value: 'XXX'
        reason: 'Fix it now or open a task.'
      - value: 'for now'
        reason: 'Temporary code becomes the pattern agents copy. Fix it or open a task.'
      - value: 'workaround'
        reason: 'Fix the root cause, or link the external constraint that forces it.'
  ForbiddenImport:
    active: true
    imports:
      - value: 'java.util.Date'
        reason: 'Use java.time.'
      - value: 'android.util.Log'
        reason: 'Use the app logger.'
  WildcardImport:
    active: true
    excludeImports: []
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  MagicNumber:
    active: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
