# Team defaults for Codex in this repository. Codex applies this file after you trust the project.
#
# Install the kit once per machine (Codex does not install plugin dependencies, so add each plugin):
#   codex plugin marketplace add tsnAnh/skills
#   for p in trust-ladder pstack cursor-team-kit thermos orchestrate cursor-sdk continual-learning cli-for-agent agent-compatibility advisor teaching; do codex plugin add "$p@team-kit"; done

model = "gpt-6-sol"
model_reasoning_effort = "max"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
