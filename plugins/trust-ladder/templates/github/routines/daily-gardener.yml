name: gardener

on:
  schedule:
    - cron: "43 3 * * 1-5"
  workflow_dispatch:

jobs:
  garden:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/tsnAnh/skills.git
          plugins: |
            trust-ladder@team-kit
          prompt: |
            Run the trust-ladder gardener skill for the last 7 days.
            Open one pull request per smell you stop (a rule plus its baseline), and one issue per cleanup task.
            Post nothing if no smell spread this week.
          claude_args: |
            --model claude-opus-5-5 --effort max
