name: weekly-review

on:
  schedule:
    - cron: "11 1 * * 5"
  workflow_dispatch:

jobs:
  recap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/tsnAnh/skills.git
          plugins: |
            trust-ladder@team-kit
          prompt: |
            Read .agents/routines/weekly-review.md and follow it.
          claude_args: |
            --model claude-opus-5-5 --effort max
