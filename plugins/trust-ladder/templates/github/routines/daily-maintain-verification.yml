name: maintain-verification-skill

on:
  schedule:
    - cron: "17 2 * * 1-5"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/tsnAnh/skills.git
          plugins: |
            trust-ladder@team-kit
          prompt: |
            Read .agents/routines/maintain-verification.md and follow it.
          claude_args: |
            --model claude-opus-5-5 --effort max
