name: Request a change
description: Ask for a change to the app in plain words. An agent builds it and opens a pull request with screenshots for an engineer to review.
title: "Change: "
labels: ["requested-change"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you want, not how to build it. An agent picks this up, restates it in a comment, builds it on a branch, and opens a pull request with before and after screenshots. Nothing goes live until an engineer reviews and merges it.
  - type: textarea
    id: what
    attributes:
      label: What should be different?
      description: What a user will see or be able to do afterwards.
      placeholder: The checkout button should say "Place order" instead of "Submit".
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app?
      placeholder: Checkout screen, after adding an item to the cart
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Mockup, screenshot, or link (optional)
      description: Paste an image or a link to a design.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - Text or copy
        - Layout or visual design
        - Something is broken
        - A small new behavior
    validations:
      required: true
