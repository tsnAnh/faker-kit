# Merged into ~/.hermes/profiles/dispatcher/config.yaml by install.sh, so the dispatcher's
# background gateway serves only this webhook. install.sh replaces the secret placeholder
# with a generated secret it keeps in ~/.hermes/team-kit/webhook-secret.
#
# The route runs no agent of its own, so it has no toolsets: github-triage.py drops every
# event that does not change a unit's state, and a kept event fires the dispatcher-drain
# cron job with the prompt below as its context. The job runs with the dispatcher
# profile's toolsets, under the guard. Hermes refuses `coalesce` together with
# `cron_job`. An event that arrives while the job runs is not queued, so the job's sweep
# re-reads every open unit, and its schedule is the safety net.
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      routes:
        team-kit-github:
          events: [pull_request, issue_comment, check_suite]
          secret: "@TEAM_KIT_WEBHOOK_SECRET@"
          script: team-kit/github-triage.py
          cron_job: dispatcher-drain
          prompt: |
            team-kit unit event: {team_kit.event}
            repo: {team_kit.repo}
            card: {team_kit.card}
            issue: {team_kit.issue}
            pr: {team_kit.pr}
            status: {team_kit.status}
            conclusion: {team_kit.conclusion}
