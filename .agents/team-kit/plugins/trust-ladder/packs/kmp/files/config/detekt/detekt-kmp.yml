style:
  ForbiddenImport:
    active: true
    includes: ['**/commonMain/**', '**/commonTest/**']
    imports:
      - value: 'java.*'
        reason: 'commonMain compiles for every target. Put JVM APIs behind an expect/actual in jvmMain or androidMain.'
      - value: 'javax.*'
        reason: 'commonMain compiles for every target. Put JVM APIs behind an expect/actual.'
      - value: 'android.*'
        reason: 'Android APIs belong in androidMain behind an expect/actual.'
      - value: 'androidx.*'
        reason: 'Android APIs belong in androidMain behind an expect/actual.'
      - value: 'platform.*'
        reason: 'iOS platform APIs belong in iosMain behind an expect/actual.'
      - value: 'kotlinx.coroutines.runBlocking'
        reason: 'runBlocking does not exist on every target. Make the caller suspend.'
