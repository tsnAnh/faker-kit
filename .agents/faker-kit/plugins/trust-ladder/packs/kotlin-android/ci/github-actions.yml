kotlin-android:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - uses: gradle/actions/setup-gradle@v4
    - run: curl -sSfL -o /usr/local/bin/ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint && chmod +x /usr/local/bin/ktlint
    - run: ./gradlew detektMain detektTest
    - run: ktlint "**/*.kt" "**/*.kts" "!**/build/**"
    - run: ./gradlew lint test
