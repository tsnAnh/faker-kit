swift:
  runs-on: macos-latest
  steps:
    - uses: actions/checkout@v4
    - run: brew install swiftlint
    - run: swiftlint lint --strict
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npx -y -p @ast-grep/cli ast-grep scan
    - run: xcodebuild -scheme App -destination 'platform=iOS Simulator,name=iPhone 16' build test | xcpretty
