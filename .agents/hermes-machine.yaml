# The always-on Hermes machine for this repository (a Raspberry Pi 5). Rebuild it anywhere with
#   gh repo clone tsnAnh/faker-kit && faker-kit/hermes/setup-machine.sh
# hermes/templates/machine.yaml explains each field. No secrets here.
version: 1
bootstrap_bot: faker-kit-bootstrap
claude_subscription: true

skills:
  - pstack
  - trust-ladder

guard:
  trusted_authors:
    - tsnAnh
  ask_owner: false
  max_in_flight_total: 5

chief:
  bot: chief

projects:
  - bot: faker-kit
    project: faker-kit
    repo: tsnAnh/faker-kit
    heartbeat_every: 1h

webhooks:
  url: https://hermes.CHANGE-ME.example
  tunnel: hermes

slack:
  bot: faker-kit
  channel_id: CHANGE-ME
