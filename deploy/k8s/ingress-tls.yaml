# HTTPS with a cert-manager ClusterIssuer. The deploy workflow uses this file when the
# DOCS_TLS_ISSUER variable is set, and replaces __HOST__ and __TLS_ISSUER__.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-kit-docs
  namespace: team-kit-docs
  annotations:
    cert-manager.io/cluster-issuer: __TLS_ISSUER__
    traefik.ingress.kubernetes.io/router.middlewares: team-kit-docs-https-redirect@kubernetescrd
spec:
  tls:
    - hosts:
        - __HOST__
      secretName: team-kit-docs-tls
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-kit-docs
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: team-kit-docs
spec:
  redirectScheme:
    scheme: https
    permanent: true
