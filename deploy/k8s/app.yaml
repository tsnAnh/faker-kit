# The docs site on k3s. The deploy workflow replaces __IMAGE__ and applies this with
# ingress.yaml or ingress-tls.yaml. See deploy/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: team-kit-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-kit-docs
  namespace: team-kit-docs
  labels:
    app.kubernetes.io/name: team-kit-docs
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: team-kit-docs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-kit-docs
    spec:
      # Only needed while the GHCR package is private; a missing secret is ignored for public images.
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: team-kit-docs
  namespace: team-kit-docs
spec:
  selector:
    app.kubernetes.io/name: team-kit-docs
  ports:
    - name: http
      port: 80
      targetPort: http
