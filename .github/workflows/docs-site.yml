name: docs-site

# Builds the Mintlify site in site/ into an nginx image, pushes it to GHCR, and deploys it to
# the team's k3s server over SSH. Pull requests build the image without pushing or deploying.
# Setup (secrets, variables, first deploy): deploy/README.md.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - deploy/**
      - scripts/gen-site.mjs
      - scripts/export-site.sh
      - .dockerignore
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - docs/**
      - site/**
      - deploy/**
      - scripts/gen-site.mjs
      - scripts/export-site.sh
      - .dockerignore
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the static site
        run: bash scripts/export-site.sh
      - name: Name the image
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/team-kit-docs"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Skipped until the DOCS_HOST variable is set, so forks and unconfigured repos only build.
    if: github.event_name != 'pull_request' && vars.DOCS_HOST != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ vars.DOCS_TLS_ISSUER != '' && 'https' || 'http' }}://${{ vars.DOCS_HOST }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DOCS_HOST: ${{ vars.DOCS_HOST }}
      DOCS_TLS_ISSUER: ${{ vars.DOCS_TLS_ISSUER }}
      KUBECTL: ${{ vars.KUBECTL || 'sudo k3s kubectl' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Render the manifests
        run: |
          ingress=deploy/k8s/ingress.yaml
          [ -n "$DOCS_TLS_ISSUER" ] && ingress=deploy/k8s/ingress-tls.yaml
          { cat deploy/k8s/app.yaml; echo '---'; cat "$ingress"; } \
            | sed -e "s|__IMAGE__|${IMAGE}|g" -e "s|__HOST__|${DOCS_HOST}|g" -e "s|__TLS_ISSUER__|${DOCS_TLS_ISSUER}|g" \
            > "$RUNNER_TEMP/docs.yaml"
          if grep -n '__[A-Z_]*__' "$RUNNER_TEMP/docs.yaml"; then echo "unreplaced placeholder"; exit 1; fi
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Apply and wait for the rollout
        run: |
          remote() { ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$@"; }
          remote "$KUBECTL apply -f -" < "$RUNNER_TEMP/docs.yaml"
          if ! remote "$KUBECTL -n team-kit-docs rollout status deployment/team-kit-docs --timeout=180s"; then
            remote "$KUBECTL -n team-kit-docs get pods -o wide; $KUBECTL -n team-kit-docs get events --sort-by=.lastTimestamp | tail -20"
            exit 1
          fi
