name: docs-site

# Builds the Mintlify site in site/ into an nginx image, pushes it to GHCR, and deploys it to
# the team's k3s server over SSH. Pull requests build the image without pushing or deploying.
# Setup (secrets, variables, first deploy): deploy/README.md.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - site/**
      - deploy/**
      - scripts/gen-site.mjs
      - scripts/export-site.sh
      - .dockerignore
      - .github/workflows/docs-site.yml
  pull_request:
    paths:
      - docs/**
      - site/**
      - deploy/**
      - scripts/gen-site.mjs
      - scripts/export-site.sh
      - .dockerignore
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # main and manual runs: unchanged, GitHub-hosted build and push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the static site
        run: bash scripts/export-site.sh
      - name: Name the image
        id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/team-kit-docs"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docs/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pr:
    # Same-repository pull requests only, on the disposable self-hosted ARM64 runner. Builds the real
    # image without pushing. Forks never reach this runner. The image is arm64 and is never deployed.
    name: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, ARM64, team-kit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the static site
        run: bash scripts/export-site.sh
      - name: Runner diagnostics (metadata only, no environment, no arguments)
        run: |
          python3 - <<'PY'
          import os, subprocess

          def first(path, n=1):
              try:
                  return open(path).read().splitlines()[:n]
              except OSError as e:
                  return ["unreadable: %s" % e.__class__.__name__]

          def status_fields(*names):
              out = {}
              for line in first("/proc/self/status", 80):
                  k, _, v = line.partition(":")
                  if k in names:
                      out[k] = v.strip()
              return out

          print("arch:", os.uname().machine, "kernel:", os.uname().release)
          print("uid/gid:", os.getuid(), os.getgid())
          print("status:", status_fields("Seccomp", "NoNewPrivs", "CapEff", "CapBnd"))
          print("uid_map:", first("/proc/self/uid_map"))
          print("user ns:", os.readlink("/proc/self/ns/user"))
          print("cgroup:", first("/proc/1/cgroup"))
          print("dockerenv:", os.path.exists("/.dockerenv"), "containerenv:", os.path.exists("/run/.containerenv"))
          print("max_user_namespaces:", first("/proc/sys/user/max_user_namespaces"))
          print("apparmor_restrict_userns:", first("/proc/sys/kernel/apparmor_restrict_unprivileged_userns"))
          print("subuid entries for this uid:", sum(1 for l in first("/etc/subuid", 200) if l.split(":")[0] in (str(os.getuid()),)))
          r = subprocess.run(["unshare", "-Ur", "true"], capture_output=True, text=True)
          print("unshare -Ur true: exit", r.returncode, "stderr:", r.stderr.strip()[:200])
          for tool in ("node", "python3", "git", "buildah", "docker", "podman", "newuidmap"):
              path = subprocess.run(["sh", "-c", "command -v " + tool], capture_output=True, text=True).stdout.strip()
              ver = ""
              if path and tool in ("node", "python3", "git", "buildah"):
                  v = subprocess.run([tool, "--version"], capture_output=True, text=True)
                  ver = (v.stdout or v.stderr).strip().splitlines()[0][:80]
              print("tool:", tool, "->", path or "absent", ver)
          PY
      - name: Require the unprivileged image builder
        run: |
          command -v buildah >/dev/null || { echo "buildah is not installed in the runner image (issue 160)"; exit 1; }
      - name: Build the image without pushing
        run: buildah --storage-driver vfs bud --isolation chroot -f deploy/docs/Dockerfile -t team-kit-docs:pr .

  deploy:
    # Skipped until the DOCS_HOST variable is set, so forks and unconfigured repos only build.
    if: github.event_name != 'pull_request' && vars.DOCS_HOST != ''
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ vars.DOCS_TLS_ISSUER != '' && 'https' || 'http' }}://${{ vars.DOCS_HOST }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DOCS_HOST: ${{ vars.DOCS_HOST }}
      DOCS_TLS_ISSUER: ${{ vars.DOCS_TLS_ISSUER }}
      KUBECTL: ${{ vars.KUBECTL || 'sudo k3s kubectl' }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Render the manifests
        run: |
          ingress=deploy/k8s/ingress.yaml
          [ -n "$DOCS_TLS_ISSUER" ] && ingress=deploy/k8s/ingress-tls.yaml
          { cat deploy/k8s/app.yaml; echo '---'; cat "$ingress"; } \
            | sed -e "s|__IMAGE__|${IMAGE}|g" -e "s|__HOST__|${DOCS_HOST}|g" -e "s|__TLS_ISSUER__|${DOCS_TLS_ISSUER}|g" \
            > "$RUNNER_TEMP/docs.yaml"
          if grep -n '__[A-Z_]*__' "$RUNNER_TEMP/docs.yaml"; then echo "unreplaced placeholder"; exit 1; fi
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Apply and wait for the rollout
        run: |
          remote() { ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$@"; }
          remote "$KUBECTL apply -f -" < "$RUNNER_TEMP/docs.yaml"
          if ! remote "$KUBECTL -n team-kit-docs rollout status deployment/team-kit-docs --timeout=180s"; then
            remote "$KUBECTL -n team-kit-docs get pods -o wide; $KUBECTL -n team-kit-docs get events --sort-by=.lastTimestamp | tail -20"
            exit 1
          fi
