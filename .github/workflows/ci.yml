name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Vendored plugins match upstream plus model rules
        run: node scripts/sync-upstream.mjs --check
      - name: Manifests, frontmatter, links, catalog
        run: node scripts/validate.mjs
      - name: Generated docs are current
        run: node scripts/gen-catalog.mjs --check
      - name: trust-ladder tests (hooks, Pi extension, run-model, link-skills)
        run: bun test plugins/trust-ladder
      - name: pstack script tests
        working-directory: plugins/pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile && bun test orch watch-pr

  agents-load-the-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code, Codex, and Pi
        run: |
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code @openai/codex @earendil-works/pi-coding-agent
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Claude Code validates the marketplace and every plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: Codex installs every plugin
        run: scripts/check-codex.sh codex
      - name: Pi discovers every skill and loads the extension
        run: node scripts/check-pi-package.mjs --sdk "$RUNNER_TEMP/agents"

  lint-packs:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy import-linter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/team-kit-tools
          key: team-kit-tools-${{ hashFiles('plugins/trust-ladder/packs/tools.sh') }}
      - name: Every pack fails on its bad fixture and passes on its good one
        run: scripts/test-packs.sh
      - name: Best-practices examples pass the packs
        run: scripts/test-examples.sh

  orchestrate-tests:
    # orchestrate drives Cursor's cloud agents through @cursor/sdk. Its model catalog is
    # rewritten to the team's models, which merges the GPT-5.5 and Codex 5.3 entries into one
    # gpt-6-sol-high-fast slug, so the upstream "slugs are unique" test fails. Kept visible,
    # not blocking. See upstream/CHANGES.md.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: plugins/orchestrate/skills/orchestrate/scripts
        run: bun install --frozen-lockfile && bun test
