name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-commit-messages.mjs compares the branch with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint, type, and test tools
        run: pip install ruff mypy types-PyYAML pytest pytest-xdist pyyaml
      - name: Single check command
        run: scripts/check.sh

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hermes module guard, commands, and install
        run: pip install pytest pyyaml && python -m pytest hermes
      - name: TEMPORARY collection equivalence on Python 3.12 (removed in the next commit)
        run: |
          set -eu
          python --version
          python -m venv "$RUNNER_TEMP/va"
          "$RUNNER_TEMP/va/bin/pip" -q install pytest pyyaml
          python -m venv "$RUNNER_TEMP/vb"
          "$RUNNER_TEMP/vb/bin/pip" -q install ruff mypy types-PyYAML pytest pytest-xdist pyyaml
          for v in va vb; do echo "== $v"; "$RUNNER_TEMP/$v/bin/pip" list --format=freeze | grep -iE '^(pytest|pytest-xdist|pyyaml|execnet)=='; done
          "$RUNNER_TEMP/va/bin/python" -m pytest hermes --collect-only -q -p no:cacheprovider | grep '::' | sort > "$RUNNER_TEMP/a.ids"
          "$RUNNER_TEMP/vb/bin/python" -m pytest hermes --collect-only -q -p no:cacheprovider | grep '::' | sort > "$RUNNER_TEMP/b.ids"
          "$RUNNER_TEMP/vb/bin/python" -m pytest hermes --collect-only -q -p no:cacheprovider -n auto | grep '::' | sort > "$RUNNER_TEMP/n.ids"
          echo "validate-deps=$(wc -l < "$RUNNER_TEMP/a.ids") check-deps=$(wc -l < "$RUNNER_TEMP/b.ids") check-deps-n-auto=$(wc -l < "$RUNNER_TEMP/n.ids")"
          echo "sha256 a=$(sha256sum < "$RUNNER_TEMP/a.ids" | cut -c1-16) b=$(sha256sum < "$RUNNER_TEMP/b.ids" | cut -c1-16) n=$(sha256sum < "$RUNNER_TEMP/n.ids" | cut -c1-16)"
          echo "only in a vs b:"; comm -23 "$RUNNER_TEMP/a.ids" "$RUNNER_TEMP/b.ids" | head -20
          echo "only in b vs a:"; comm -13 "$RUNNER_TEMP/a.ids" "$RUNNER_TEMP/b.ids" | head -20
          echo "only in b vs n:"; comm -23 "$RUNNER_TEMP/b.ids" "$RUNNER_TEMP/n.ids" | head -20
          echo "only in n vs b:"; comm -13 "$RUNNER_TEMP/b.ids" "$RUNNER_TEMP/n.ids" | head -20
          cmp "$RUNNER_TEMP/a.ids" "$RUNNER_TEMP/b.ids"
          cmp "$RUNNER_TEMP/b.ids" "$RUNNER_TEMP/n.ids"
          echo "COLLECTION IDENTICAL on $(python --version)"
      - name: pstack script tests
        working-directory: plugins/pstack/skills/faker-mode/scripts
        run: bun install --frozen-lockfile && bun test orch watch-pr
      - name: orchestrate engine, runtimes, and lint
        working-directory: plugins/trust-ladder/skills/orchestrate/scripts
        run: bun install --frozen-lockfile && bun x biome check . && bun x tsc --noEmit && bun test

  agents-load-the-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code, Codex, and Pi
        run: |
          # Codex publishes its main package minutes before each platform binary, and npm skips a
          # missing optional binary without an error. Take the newest release whose Linux build is out.
          platform=linux-$(case "$(uname -m)" in aarch64|arm64) echo arm64 ;; *) echo x64 ;; esac)
          codex=$(npm view @openai/codex "dist-tags.$platform")
          test -n "$codex"
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code "@openai/codex@${codex%-$platform}" @earendil-works/pi-coding-agent
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/agents/node_modules/.bin/codex" --version
      - name: Claude Code validates the marketplace and every plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: Codex installs every plugin
        run: scripts/check-codex.sh codex
      - name: Pi discovers every skill and loads the extension
        run: node scripts/check-pi-package.mjs --sdk "$RUNNER_TEMP/agents"

  lint-packs:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy import-linter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/team-kit-tools
          key: team-kit-tools-${{ hashFiles('plugins/trust-ladder/packs/tools.sh') }}
      - name: Every pack fails on its bad fixture and passes on its good one
        run: scripts/test-packs.sh
      - name: Best-practices examples pass the packs
        run: scripts/test-examples.sh
