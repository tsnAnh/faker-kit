name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint and type tools
        run: pip install ruff mypy types-PyYAML pyyaml
      - name: Install Claude Code
        run: |
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          node scripts/agent-checks/ratchet.mjs check
          node scripts/agent-checks/import-boundaries.mjs
          node scripts/agent-checks/rule-fixtures.mjs
          ruff check
          mypy

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-commit-messages.mjs compares the branch with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Commit messages
        run: node scripts/check-commit-messages.mjs

  hermes-e2e:
    name: hermes-e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python end-to-end tools
        run: pip install pyyaml
      - name: Hermes end-to-end
        run: python3 hermes/e2e/run_dispatch_e2e.py --shard ${{ matrix.shard }}/4 --artifact artifacts/hermes-e2e-${{ matrix.shard }}.json
      - name: End-to-end transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-transcripts-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: ignore

  check:
    needs: [lint, commit-messages, hermes-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every CI job passed
        env:
          RESULTS: ${{ needs.lint.result }} ${{ needs.commit-messages.result }} ${{ needs.hermes-e2e.result }}
        run: |
          echo "lint, commit-messages, hermes-e2e: $RESULTS"
          [ "$RESULTS" = "success success success" ]

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Vendored plugins match upstream plus model rules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-upstream.mjs --check
      - name: Manifests, frontmatter, links, catalog
        run: node scripts/validate.mjs
      - name: Generated docs are current
        run: node scripts/gen-catalog.mjs --check
      - name: pstack script tests
        working-directory: plugins/pstack/skills/faker-mode/scripts
        run: bun install --frozen-lockfile && bun test orch watch-pr

  agents-load-the-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Install Claude Code
        run: |
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Claude Code validates the marketplace and every plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: The kit's scripts and hooks run, and every plugin installs
        run: node scripts/e2e/kit-e2e.mjs --artifact artifacts/kit-e2e.json
      - name: End-to-end transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-e2e-transcript
          path: artifacts/
          if-no-files-found: ignore
