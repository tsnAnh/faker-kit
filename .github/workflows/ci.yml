name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-commit-messages.mjs compares the branch with origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python lint, type, and end-to-end tools
        run: pip install ruff mypy types-PyYAML pyyaml
      - name: Install Claude Code
        run: |
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Single check command
        run: scripts/check.sh
      - name: End-to-end transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-transcripts
          path: artifacts/
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Vendored plugins match upstream plus model rules
        run: node scripts/sync-upstream.mjs --check
      - name: Manifests, frontmatter, links, catalog
        run: node scripts/validate.mjs
      - name: Generated docs are current
        run: node scripts/gen-catalog.mjs --check
      - name: pstack script tests
        working-directory: plugins/pstack/skills/faker-mode/scripts
        run: bun install --frozen-lockfile && bun test orch watch-pr

  agents-load-the-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          npm i --prefix "$RUNNER_TEMP/agents" @anthropic-ai/claude-code
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Claude Code validates the marketplace and every plugin
        run: |
          claude plugin validate .
          for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - name: The kit's scripts and hooks run, and every plugin installs
        run: node scripts/e2e/kit-e2e.mjs --artifact artifacts/kit-e2e.json
      - name: End-to-end transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kit-e2e-transcript
          path: artifacts/
          if-no-files-found: ignore

  lint-packs:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy import-linter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dart-lang/setup-dart@v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/faker-kit-tools
          key: faker-kit-tools-${{ hashFiles('plugins/trust-ladder/packs/tools.sh') }}
      - name: Every pack fails on its bad fixture and passes on its good one
        run: scripts/test-packs.sh
      - name: Best-practices examples pass the packs
        run: scripts/test-examples.sh
