# Lint and type-check configuration for the kit's own Python: hermes/ and plugins/trust-ladder/.
# CI's `lint` job runs `ruff check` and `mypy`; legacy violations carry a `faker-kit baseline` marker that
# .agents/ratchet.json only lets go down.

[tool.ruff]
# The kit's code is written to long lines; 200 keeps the rule meaningful without rewrapping every file.
line-length = 200
extend-exclude = [
  ".agents",
  "site",
  # Third-party packages copied unchanged (see hermes/vendor/README.md).
  "hermes/vendor",
  # Vendored from upstream (see upstream/source.json); never edited by hand, so never linted here.
  "plugins/advisor",
  "plugins/agent-compatibility",
  "plugins/cli-for-agent",
  "plugins/continual-learning",
  "plugins/pstack",
  "plugins/teaching",
  "plugins/team-workflows",
  "plugins/thermos",
]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "RET", "PTH",
  "ANN", "BLE", "TRY", "ARG", "S",
  "T20",
  "ERA",
  "PGH",
  "TID",
  "PLC0415",
]
# TRY003: messages name the failing value in place, which is how refusals reach the owner.
# S101: asserts state the few invariants code relies on.
# S603, S607: the kit runs gh, git, hermes, and claude as argument lists with no shell, by design.
ignore = ["TRY003", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# Command-line entry points print their JSON or notice lines to stdout, and put lib/ and plugin/
# on sys.path before importing from them.
"hermes/bin/**" = ["T20", "E402"]
"hermes/e2e/**" = ["T20"]
"plugins/trust-ladder/**/scripts/**" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Model the type. If a boundary really is untyped, parse it into a typed object there."

[tool.mypy]
files = ["hermes/lib", "hermes/bin", "hermes/plugin"]
mypy_path = ["hermes/lib", "hermes/bin", "hermes/plugin"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]

# Modules held to strict typing. Move a module here once its baseline markers are gone.
[[tool.mypy.overrides]]
module = ["faker_kit_andon", "faker_kit_cloud", "faker_kit_env", "faker_kit_incident_sources", "faker_kit_kanban", "faker_kit_launch", "faker_kit_machine", "faker_kit_t3code", "faker_kit_guard.t3code"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
strict_equality = true
